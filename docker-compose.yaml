version: "3.9"

services:
  integrator-app:
    build: .
    container_name: integrator-app
    env_file:
      - ".env"
    depends_on:
      integrator-postgres:
        condition: service_healthy
      integrator-redis:
        condition: service_healthy
    restart: always
    ports:
      - "8010:8000"
    volumes:
      - .:/liccontrol-integrator-back-end
    networks:
      - license_control
  # integrator-telegram-bot:
  #   build: .
  #   container_name: integrator-telegram-bot
  #   env_file:
  #     - ".env"
  #   depends_on:
  #     integrator-redis:
  #       condition: service_healthy
  #   restart: always
  #   entrypoint: ["python", "-m", "src.runner_bot"]
  #   volumes:
  #     - .:/liccontrol-integrator-back-end
  #   networks:
  #     - license_control

  integrator-postgres:
    image: postgres
    container_name: integrator-postgres
    restart: always
    env_file: ".env"
    volumes:
      - integrator-postgres-data:/var/lib/postgresql/data
    ports:
      - "5455:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - license_control

  integrator-redis:
    image: redis
    container_name: integrator-redis
    ports:
      - "6377:6379"
    volumes:
      - integrator-redis-data:/data
    env_file: ".env"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - license_control

volumes:
  integrator-postgres-data:
  integrator-redis-data:

networks:
  license_control:
    driver: bridge
    name: license_control
