[project]
name = "liccontrol-integrator-back-end"
version = "0.1.0"
description = "сервис интегратор"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi (>=0.115.8,<0.116.0)",
    "alembic (>=1.15.1,<2.0.0)",
    "aiosmtplib (>=4.0.0,<5.0.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "pydantic[email] (>=2.10.6,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "dynaconf (>=3.2.10,<4.0.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "redis (>=5.2.1,<6.0.0)",
    "orjson (>=3.10.16,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "beautifulsoup4 (>=4.13.3,<5.0.0)",
    "pillow (>=11.2.1,<12.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "requests (>=2.32.3,<3.0.0)",
    "cryptography (>=45.0.2,<46.0.0)",
    "aiogram (>=3.22.0,<4.0.0)"
]

[tool.poetry]
packages = [
    { include = "adapters", from = "src" },
    { include = "application", from = "src" },
    { include = "domain", from = "src" },
    { include = "infrastructure", from = "src" },
    { include = "interfaces", from = "src" }
]


[tool.poetry.scripts]
app = "src.runner:run_app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
